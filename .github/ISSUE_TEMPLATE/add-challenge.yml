name: ➕ Add a design challenge
description: Propose a design problem and the questions a designer needs answered.
title: '[Challenge] '
labels:
- contribution
- type:challenge
body:
- type: markdown
  attributes:
    value: 'A **design challenge** is a problem a designer is solving or trying to avoid — e.g. *user error during critical interaction*, *excessive hand force*.


      A maintainer reviews your submission. When it is labelled **accepted**, a bot turns it into an Atlas note (status *proposed*) and opens a pull request. Thank you!'
- type: input
  id: name
  attributes:
    label: Challenge name
    description: Short, noun phrase.
    placeholder: e.g. Poor thermal comfort
  validations:
    required: true
- type: dropdown
  id: domain
  attributes:
    label: Domain
    options:
    - usability
    - cognitive-ergonomics
    - physical-ergonomics
    - safety
    - accessibility
    - logistics
    - manufacturing
    - sustainability
    multiple: true
  validations:
    required: true
- type: textarea
  id: s_problem
  attributes:
    label: Problem
    description: What goes wrong, for whom, in which situation?
  validations:
    required: true
- type: textarea
  id: s_questions
  attributes:
    label: Design questions
    description: What exactly does the designer need to find out? One per line.
    placeholder: '- Can the user … ?

      - How much … ?'
  validations:
    required: true
- type: textarea
  id: s_why
  attributes:
    label: Why it matters
    description: Consequences if not addressed.
  validations:
    required: false
- type: textarea
  id: metrics
  attributes:
    label: What could be measured?
    description: One page name per line. Use names of existing Atlas pages where possible — unknown names are kept for the maintainer to match.
    placeholder: 'Task completion time

      Use error rate'
  validations:
    required: false
- type: textarea
  id: related_challenges
  attributes:
    label: Related challenges
    description: One page name per line. Use names of existing Atlas pages where possible — unknown names are kept for the maintainer to match.
  validations:
    required: false
- type: dropdown
  id: evidence_level
  attributes:
    label: What kind of evidence supports this?
    options:
    - A — primary source (standard catalogue, peer-reviewed paper, official vendor spec)
    - B — credible secondary source (review, textbook, expert guide)
    - C — partial sourcing / own professional experience
    - D — hypothesis, not yet backed by sources
    multiple: false
  validations:
    required: true
- type: textarea
  id: s_sources
  attributes:
    label: Evidence and sources
    description: Links, DOIs or references backing the claims above.
    placeholder: 'https://…

      doi:…'
  validations:
    required: true
- type: checkboxes
  id: confirm
  attributes:
    label: Before you submit
    options:
    - label: I have searched the Atlas and this is not already there.
      required: true
    - label: I have not copied text from standards or other copyrighted sources.
      required: true
    - label: I agree that my contribution is published in the Atlas under the project's content licence.
      required: true
