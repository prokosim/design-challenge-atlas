name: 🕳️ Report a tool gap
description: Something you need to measure or know, but have no adequate digital tool for.
title: '[Gap] '
labels:
- contribution
- type:gap
body:
- type: markdown
  attributes:
    value: '**Tool gaps are the most valuable contribution to the Atlas.** Describe what you need to measure and why current tools are not good enough — it does not matter if you have no solution.


      A maintainer reviews your submission. When it is labelled **accepted**, a bot turns it into an Atlas note (status *proposed*) and opens a pull request. Thank you!'
- type: input
  id: name
  attributes:
    label: Short name of the gap
    placeholder: e.g. Measuring thermal comfort of wearables in the field
  validations:
    required: true
- type: dropdown
  id: domain
  attributes:
    label: Domain
    options:
    - usability
    - cognitive-ergonomics
    - physical-ergonomics
    - safety
    - accessibility
    - logistics
    - manufacturing
    - sustainability
    multiple: true
  validations:
    required: true
- type: textarea
  id: s_measure
  attributes:
    label: What do you want to measure?
  validations:
    required: true
- type: textarea
  id: s_decision
  attributes:
    label: What design decision would this support?
  validations:
    required: true
- type: textarea
  id: s_current
  attributes:
    label: Current practice
    description: How is it done today?
  validations:
    required: true
- type: textarea
  id: s_insufficient
  attributes:
    label: Why is the current method insufficient?
  validations:
    required: true
- type: textarea
  id: s_ideal
  attributes:
    label: What would an ideal tool do?
    description: Inputs, outputs, level of automation.
  validations:
    required: false
- type: dropdown
  id: gap_type
  attributes:
    label: Type of gap
    options:
    - missing_tool
    - poor_tool
    - expensive_tool
    - fragmented_workflow
    - manual_process
    - missing_integration
    - missing_metric
    multiple: true
  validations:
    required: true
- type: dropdown
  id: impact
  attributes:
    label: How big is the impact?
    options:
    - low
    - medium
    - high
    multiple: false
  validations:
    required: true
- type: dropdown
  id: opportunity
  attributes:
    label: What kind of solution might close it?
    options:
    - research
    - software
    - hardware
    - ai
    - automation
    - new-method
    multiple: true
  validations:
    required: false
- type: textarea
  id: challenges
  attributes:
    label: Related design challenges
    description: One page name per line. Use names of existing Atlas pages where possible — unknown names are kept for the maintainer to match.
  validations:
    required: false
- type: textarea
  id: metrics
  attributes:
    label: Related metrics
    description: One page name per line. Use names of existing Atlas pages where possible — unknown names are kept for the maintainer to match.
  validations:
    required: false
- type: textarea
  id: methods
  attributes:
    label: Related methods
    description: One page name per line. Use names of existing Atlas pages where possible — unknown names are kept for the maintainer to match.
  validations:
    required: false
- type: textarea
  id: tools_considered
  attributes:
    label: Tools you considered
    description: One page name per line. Use names of existing Atlas pages where possible — unknown names are kept for the maintainer to match. Say why they fall short in the section above.
  validations:
    required: false
- type: input
  id: s_industry
  attributes:
    label: Industry / field
    placeholder: e.g. automotive assembly, medical devices
  validations:
    required: false
- type: dropdown
  id: evidence_level
  attributes:
    label: What kind of evidence supports this?
    options:
    - A — primary source (standard catalogue, peer-reviewed paper, official vendor spec)
    - B — credible secondary source (review, textbook, expert guide)
    - C — partial sourcing / own professional experience
    - D — hypothesis, not yet backed by sources
    multiple: false
  validations:
    required: true
- type: textarea
  id: s_sources
  attributes:
    label: Evidence and sources
    description: Links, DOIs or references backing the claims above.
    placeholder: 'https://…

      doi:…'
  validations:
    required: true
- type: checkboxes
  id: confirm
  attributes:
    label: Before you submit
    options:
    - label: I have searched the Atlas and this is not already there.
      required: true
    - label: I have not copied text from standards or other copyrighted sources.
      required: true
    - label: I agree that my contribution is published in the Atlas under the project's content licence.
      required: true
