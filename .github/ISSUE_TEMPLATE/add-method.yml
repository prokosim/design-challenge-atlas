name: 🔬 Add a method
description: Propose a measurement or evaluation method.
title: '[Method] '
labels:
- contribution
- type:method
body:
- type: markdown
  attributes:
    value: 'A **method** is a way of measuring or evaluating — e.g. usability testing, digital human simulation.


      A maintainer reviews your submission. When it is labelled **accepted**, a bot turns it into an Atlas note (status *proposed*) and opens a pull request. Thank you!'
- type: input
  id: name
  attributes:
    label: Method name
  validations:
    required: true
- type: dropdown
  id: domain
  attributes:
    label: Domain
    options:
    - usability
    - cognitive-ergonomics
    - physical-ergonomics
    - safety
    - accessibility
    - logistics
    - manufacturing
    - sustainability
    multiple: true
  validations:
    required: true
- type: dropdown
  id: method_kind
  attributes:
    label: Kind of method
    options:
    - empirical-test
    - analytical
    - simulation
    - questionnaire
    - observation
    - instrumented-measurement
    multiple: false
  validations:
    required: true
- type: textarea
  id: s_what
  attributes:
    label: What it is
  validations:
    required: true
- type: textarea
  id: s_how
  attributes:
    label: How it works
    description: Main steps.
  validations:
    required: false
- type: textarea
  id: s_strengths
  attributes:
    label: Strengths
  validations:
    required: false
- type: textarea
  id: s_limitations
  attributes:
    label: Limitations
  validations:
    required: false
- type: dropdown
  id: evidence_level
  attributes:
    label: What kind of evidence supports this?
    options:
    - A — primary source (standard catalogue, peer-reviewed paper, official vendor spec)
    - B — credible secondary source (review, textbook, expert guide)
    - C — partial sourcing / own professional experience
    - D — hypothesis, not yet backed by sources
    multiple: false
  validations:
    required: true
- type: textarea
  id: s_sources
  attributes:
    label: Evidence and sources
    description: Links, DOIs or references backing the claims above.
    placeholder: 'https://…

      doi:…'
  validations:
    required: true
- type: checkboxes
  id: confirm
  attributes:
    label: Before you submit
    options:
    - label: I have searched the Atlas and this is not already there.
      required: true
    - label: I have not copied text from standards or other copyrighted sources.
      required: true
    - label: I agree that my contribution is published in the Atlas under the project's content licence.
      required: true
