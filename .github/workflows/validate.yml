# Runs on every pull request and push: checks all notes against schema/ontology.yml
# and makes sure the site content can be prepared.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate notes
        run: node scripts/validate.mjs
      - name: Prepare site content (no Quartz build)
        run: node scripts/build-site.mjs --skip-quartz
